[project]
name = "sample"
version = "0.1.0"
description = "Sample application for discussion"
authors = [
    {name = "Support",email = "support@openc3.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "requests>=2.32.3,<3.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.10,<8.0.0",
    "pytest>=8.3.4,<9.0.0",
    "pytest-profiling>=1.8.1,<2.0.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.14"
