services:
  web:
    build: .
    command: bundle exec rails s -b '0.0.0.0'
    ports:
      - "3000:3000"
    environment:
      - RAILS_MASTER_KEY
      - RAILS_ENV=test
    volumes:
      - "./storage/test.sqlite3:/rails/storage/test.sqlite3"

    develop:
      watch:
        - action: rebuild
          path: .
